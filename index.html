<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estate Portfolio</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:#f5f7fb;
display:flex;
min-height:100vh;
}

/* ========== LOGIN ========== */
.login{
margin:auto;
background:#fff;
padding:30px;
width:330px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
text-align:center;
}
.login input{
width:100%;
padding:12px;
margin-bottom:12px;
border-radius:8px;
border:1px solid #ddd;
}
.login button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:600;
cursor:pointer;
}

/* ========== SIDEBAR ========== */
.sidebar{
width:230px;
background:#0b1e35;
color:#fff;
padding:20px;
}
.sidebar h2{
display:flex;
align-items:center;
gap:10px;
margin-bottom:30px;
}
.sidebar a{
display:block;
padding:12px 15px;
margin-bottom:8px;
border-radius:8px;
color:#cbd5e1;
text-decoration:none;
cursor:pointer;
}
.sidebar a.active,
.sidebar a:hover{
background:#2563eb;
color:#fff;
}

/* ========== MAIN ========== */
.main{
flex:1;
padding:25px;
}

/* ========== CARDS ========== */
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}
.card{
background:#fff;
padding:20px;
border-radius:12px;
}
.card h4{
color:#6b7280;
font-weight:600;
}
.card h2{
margin-top:5px;
}

/* ========== ALERT BAR ========== */
.alert-bar{
background:#fde047;
padding:12px 15px;
border-radius:8px;
font-weight:600;
margin-bottom:20px;
}

/* ========== CHART ========== */
.chart-card{
background:#fff;
padding:20px;
border-radius:12px;
}

/* ========== PROPERTY GRID ========== */
.properties-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}
.property-card{
background:#fff;
padding:10px;
border-radius:12px;
}
.property-card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:10px;
}

/* ========== AGENTS ========== */
.agents-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}
.agent-card{
background:#fff;
padding:15px;
border-radius:12px;
text-align:center;
}
.agent-card img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
}

/* ========== MOBILE ========== */
@media(max-width:768px){
.sidebar{
display:none;
}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginBox">
<h2>Estate Login</h2>
<input id="username" placeholder="Username">
<input id="password" type="password">
<button onclick="login()">Login</button>
<p id="loginMsg"></p>
</div>

<!-- APP -->
<div id="app" style="display:none; width:100%;">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>🏠 Estate</h2>
<a class="active" onclick="showSection('dashboard',this)">Dashboard</a>
<a onclick="showSection('properties',this)">Properties</a>
<a onclick="showSection('agents',this)">Agents</a>
<a onclick="showSection('sales',this)">Sales</a>
<a onclick="logout()">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">

<h2 style="margin-bottom:20px;">Dashboard</h2>

<div class="cards">
<div class="card">
<h4>Total Properties</h4>
<h2 id="totalProperties">4</h2>
</div>

<div class="card">
<h4>Total Sales</h4>
<h2 id="totalSales">0</h2>
</div>

<div class="card">
<h4>Agents</h4>
<h2>3</h2>
</div>
</div>

<div class="alert-bar">
Hot Deal: Luxury Villa available now!
</div>

<div class="chart-card">
<canvas id="salesChart" height="120"></canvas>
</div>

</div>

<!-- PROPERTIES -->
<div id="properties" style="display:none;">

<h2 style="margin-bottom:20px;">Properties</h2>

<div class="properties-grid">
<div class="property-card">
<img src="images/property1.png">
<p>Modern Family House</p>
</div>

<div class="property-card">
<img src="images/property2.png">
<p>Luxury Villa</p>
</div>

<div class="property-card">
<img src="images/property3.png">
<p>City Apartment</p>
</div>

<div class="property-card">
<img src="images/property4.png">
<p>Country Home</p>
</div>
</div>

</div>

<!-- AGENTS -->
<div id="agents" style="display:none;">

<h2 style="margin-bottom:20px;">Agents</h2>

<div class="agents-grid">
<div class="agent-card">
<img src="images/agent1.png">
<p>Sarah Johnson</p>
</div>

<div class="agent-card">
<img src="images/agent2.png">
<p>Michael Lee</p>
</div>

<div class="agent-card">
<img src="images/agent3.png">
<p>Emma Brown</p>
</div>
</div>

</div>

<!-- SALES -->
<div id="sales" style="display:none;">

<h2 style="margin-bottom:20px;">Add Sale</h2>

<input id="saleAmount" type="number" placeholder="Sale Amount">
<button onclick="addSale()">Add Sale</button>

</div>

</div>
</div>

<script>
/* LOGIN */
function login(){
if(username.value==="admin" && password.value==="admin"){
loginBox.style.display="none";
app.style.display="flex";
drawChart();
}else{
loginMsg.textContent="Use admin / admin";
}
}

function logout(){
location.reload();
}

/* NAV */
function showSection(id,el){
document.querySelectorAll(".main > div").forEach(d=>d.style.display="none");
document.getElementById(id).style.display="block";
document.querySelectorAll(".sidebar a").forEach(a=>a.classList.remove("active"));
el.classList.add("active");
}

/* SALES DATA */
let sales=[];

function addSale(){
const val=Number(saleAmount.value);
if(val<=0) return alert("Enter amount");
sales.push(val);
totalSales.textContent=sales.length;
drawChart();
saleAmount.value="";
}

/* CHART */
let chart;
function drawChart(){
const ctx=document.getElementById("salesChart");
if(chart) chart.destroy();
chart=new Chart(ctx,{
type:"bar",
data:{
labels:sales.map((_,i)=>"Sale "+(i+1)),
datasets:[{
label:"Sales Amount",
data:sales,
backgroundColor:"#2563eb",
borderRadius:6
}]
},
options:{
scales:{
y:{beginAtZero:true}
}
}
});
}
</script>

</body>
</html>
